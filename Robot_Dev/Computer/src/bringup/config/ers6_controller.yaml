controller_manager:
  ros__parameters:
    update_rate: 25

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    position_controller:
      type: position_controllers/JointGroupPositionController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6

    command_interfaces:
      - position

    state_interfaces:
      - position

    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    interpolate_from_desired_state: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      Joint_1:
        #trajectory: 0.03
        goal: 0.03
      Joint_2:
        #trajectory: 0.03
        goal: 0.03

position_controller:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
